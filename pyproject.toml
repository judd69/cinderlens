[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cinderlens"
version = "0.1.0"
description = "Zero-dependency Python profiler: profile any script with stdlib cProfile and get a self-contained interactive HTML flamegraph report, plus an A/B compare mode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jude Davies" }]
keywords = ["profiler", "cprofile", "flamegraph", "performance", "profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
cinderlens = "cinderlens.cli:main"

[project.urls]
Homepage = "https://github.com/judd69/cinderlens"
Repository = "https://github.com/judd69/cinderlens"

[tool.setuptools.packages.find]
include = ["cinderlens*"]
